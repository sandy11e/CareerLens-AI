name: CareerLens AI CI

on:
  push:
    branches:
      - main
      - production
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerlens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Run S3 and MongoDB persistence unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_s3_storage test_database_persistence test_resume_parser

      - name: Smoke-test backend services
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python test_backend.py

      - name: Check installed dependencies
        run: python -m pip check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: https://api.invalid

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        
  manual-approval:
    name: Manual approval
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    # Only demonstrate the approval gate on pushes.
    if: github.event_name == 'push'

    environment:
      name: ci-manual-approval

    steps:
      - name: Approval granted
        run: echo "Manual approval received. CI pipeline completed."