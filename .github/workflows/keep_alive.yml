name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          echo "Pinging Render backend..."
          curl -sS --retry 2 --max-time 30 https://devlyzer-ai.onrender.com/api/health || echo "Ping attempted"
